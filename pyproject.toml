[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-pricing-model"
version = "0.2.0"
description = "Quant toolkit for derivatives pricing (Black-Scholes, Fourier/Heston, PDE, American LSM, SABR, local-vol, jumps), hedging, calibration, and stress testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Pio Natale" }]
keywords = [
    "quantitative-finance",
    "derivatives-pricing",
    "options-pricing",
    "monte-carlo",
    "heston",
    "sabr",
    "local-volatility",
    "hedging",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "hypothesis>=6.0",
]
# Optional JIT acceleration. Kept separate from runtime deps because numba's
# wheel support lags new CPython releases; the hot loops have a pure-numpy fallback.
accel = ["numba>=0.59.0"]

[project.urls]
Homepage = "https://github.com/francescopionatale/derivatives-pricing-model"
Repository = "https://github.com/francescopionatale/derivatives-pricing-model"

[project.scripts]
derivatives-pricing-model = "cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line length) is noisy on math-heavy code with long formula expressions.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files deliberately re-export public symbols.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Plotting glue against matplotlib's incomplete stubs — not numerical core.
module = ["visualization.*"]
ignore_errors = true
